      if (type==='object') { rows.push([fp,'object',desc,'']); flattenCSV(v,descs,fp).forEach(function(r){rows.push(r);}); }
      else if (type==='array') { rows.push([fp,'array['+v.length+']',desc,'']); if(v.length>0) flattenCSV(v,descs,fp).forEach(function(r){rows.push(r);}); }
      else { rows.push([fp,type,desc,v===null?'null':String(v)]); }
    });
    return rows;
  }
  function downloadCSV(data, descs, name) {
    const rows=[['Field Path','Type','Description','Value']].concat(flattenCSV(data,descs,''));
    const csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
    const fname=(name||'eligibility-schema').replace(/[^a-z0-9_-]/gi,'_');
    const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fname+'.csv'; a.click(); URL.revokeObjectURL(url);
  }

  // ── TREE NODE ────────────────────────────────────────────────

    const [collapsed, setCollapsed] = useState(true);

    const [editingRow, setEditingRow] = useState(false);

    const prevForce = useRef(forceOpen);
    if (prevForce.current !== forceOpen) { setCollapsed(forceOpen !== true); prevForce.current = forceOpen; }

    const type = getType(value);
    const isExpandable = type==='object'||(type==='array'&&value&&value.length>0);
    const isArr = type==='array';
    const desc = descriptions[fieldKey];
    const indent = depth*14;
    const isArrIndex = typeof fieldKey === 'string' && fieldKey.startsWith('[');

        style={{outline:dragOver?'2px solid '+T.blue:'none',borderRadius:4}}>

        <div style={{display:'grid',gridTemplateColumns:'minmax(160px,260px) minmax(0,1fr)'+(editMode?' auto':''),gap:16,padding:'8px 0',borderBottom:'1px solid '+T.border2,alignItems:'start',background:dragOver?T.blue25:'transparent'}}>

            </span>

              style={{fontFamily:T.mono,fontSize:13,fontWeight:500,color:T.textPrimary,wordBreak:'break-word',cursor:isExpandable?'pointer':'default',lineHeight:1.4}}>{displayKey}</span>{desc&&/\bNA\b/i.test(desc)&&<span style={{marginLeft:6,fontSize:10,fontWeight:600,color:'rgb(180,30,30)',background:'rgb(255,235,235)',border:'1px solid rgb(250,180,180)',borderRadius:3,padding:'1px 5px',verticalAlign:'middle',letterSpacing:'0.03em'}}>NA</span>}{desc&&/\bRedun/i.test(desc)&&<span style={{marginLeft:6,fontSize:10,fontWeight:600,color:'rgb(140,80,0)',background:'rgb(255,244,220)',border:'1px solid rgb(240,200,140)',borderRadius:3,padding:'1px 5px',verticalAlign:'middle',letterSpacing:'0.03em'}}>Redundant</span>}{desc&&/\bNEW\b/.test(desc)&&<span style={{marginLeft:6,fontSize:10,fontWeight:600,color:'rgb(22,110,52)',background:'rgb(220,250,230)',border:'1px solid rgb(140,210,160)',borderRadius:3,padding:'1px 5px',verticalAlign:'middle',letterSpacing:'0.03em'}}>NEW</span>}

          </div>

    );

    const desc = descriptions[fieldKey];

            <td style={{padding:'9px 18px',verticalAlign:'middle',whiteSpace:'nowrap'}}>
              <div style={{display:'flex',gap:4}}>
                <IBtn onClick={()=>setEditingRow(r=>!r)} title="Edit row" color={editingRow?T.blue:T.textMuted}>{IC_EDIT}</IBtn>
                <IBtn onClick={()=>onDelete(path)} title="Delete" color={T.danger}>{IC_DEL}</IBtn>
              </div>
            </td>
          )}
        </tr>

        {/* Row edit form */}
        {editingRow&&editMode&&(
          <tr style={{background:'rgb(243,246,252)'}}>
            <td colSpan={editMode?5:4} style={{padding:'8px 18px 14px '+(18+indent+28)+'px'}}>
              <RowEditForm fieldKey={fieldKey} value={value} desc={desc} isArrayIndex={isArrIndex}
                onSave={({key,value:v,desc:d})=>{onSaveRow(path,fieldKey,key,v,d);setEditingRow(false);}}
                onCancel={()=>setEditingRow(false)}/>
            </td>
          </tr>
        )}

        {/* Add form */}
        {showAdd&&editMode&&(
          <tr style={{background:T.blue25}}>
            <td colSpan={editMode?5:4} style={{padding:'6px 18px 14px '+(18+indent+32)+'px'}}>
              <AddFieldForm isArray={isArr} onAdd={(k,v,d)=>{onAdd(path,k,v,d);setShowAdd(false);}} onCancel={()=>setShowAdd(false)}/>
            </td>
          </tr>
        )}

        {/* Children */}
        {isExpandable&&expanded&&!isArr&&childEntries.map(([k,v],i)=>(
          <TableRow key={k+'_'+i} fieldKey={k} value={v} depth={depth+1}
            descriptions={descriptions} editMode={editMode}
            onDelete={onDelete} onAdd={onAdd} onSaveRow={onSaveRow} onReorder={onReorder}
            path={path.concat([k])} siblingIndex={i} colorFamily={ownFam}/>
        ))}
        {isExpandable&&expanded&&isArr&&value.map((item,ii)=>(
          <React.Fragment key={ii}>
            {ii>0&&<tr><td colSpan={editMode?5:4} style={{padding:0,height:2,background:ownFam?ownFam.bg[0]:'rgb(232,234,238)'}}></td></tr>}
            {item&&typeof item==='object'&&!Array.isArray(item)
              ? Object.entries(item).map(([k,v],i)=>(
                  <TableRow key={k+'_'+ii+'_'+i} fieldKey={k} value={v} depth={depth+1}
                    descriptions={descriptions} editMode={editMode}
                    onDelete={onDelete} onAdd={onAdd} onSaveRow={onSaveRow} onReorder={onReorder}
                    path={path.concat([ii,k])} siblingIndex={i} colorFamily={ownFam}/>
                ))
              : <TableRow key={'_item_'+ii} fieldKey={'['+ii+']'} value={item} depth={depth+1}
                  descriptions={descriptions} editMode={editMode}
                  onDelete={onDelete} onAdd={onAdd} onSaveRow={onSaveRow} onReorder={onReorder}
                  path={path.concat([ii])} siblingIndex={ii} colorFamily={ownFam} parentKey={fieldKey}/>
            }
          </React.Fragment>
        ))}
      </>
    );
  }

  // ── New Schema Modal ─────────────────────────────────────────
  function NewSchemaModal({ onClose, onCreate }) {
    const [mode, setMode] = useState('json'); // 'json' | 'form'
    const [jsonText, setJsonText] = useState('');
    const [jsonErr, setJsonErr] = useState('');
    const [formName, setFormName] = useState('');
    const [formSource, setFormSource] = useState('');
    const [formType, setFormType] = useState('');

    function stripJsonComments(str) {
      const commentMap = {};
      // Extract inline comments per field key
      str.split('\n').forEach(function(line) {
        const commentMatch = line.match(/\/\/(.+)$/);
        const keyMatch = line.match(/"([^"]+)"\s*:/);
        if (commentMatch && keyMatch) {
          commentMap[keyMatch[1]] = commentMatch[1].trim();
        }
      });
      // Strip // comments then trailing commas before } or ]
      const clean = str.replace(/\/\/[^\n]*/g, '').replace(/,(\s*[}\]])/g, '$1');
      return { clean, commentMap };
    }

    function handleJsonCreate() {
      setJsonErr('');
      try {
        const { clean, commentMap } = stripJsonComments(jsonText.trim());
        const parsed = JSON.parse(clean);
        const descs = Object.keys(commentMap).length ? commentMap : null;
        const name = formName.trim() || parsed.type || 'New Schema';
        onCreate({ id: 's' + Date.now(), name, data: parsed, descriptions: descs });
        onClose();
      } catch(e) { setJsonErr('Invalid JSON: ' + e.message); }
    }

    function handleFormCreate() {
      if (!formType.trim()) { setJsonErr('Event type name is required'); return; }
      const data = {
        id: '', time: new Date().toISOString(), type: formType.trim(),
        source: formSource.trim() || 'es/entity/new', specversion: '1.0',
        datacontenttype: 'application/json',
        data: { entityId: '', entityStatus: '', meta: { userType: '', user: '' } }
      };
      onCreate({ id: 's' + Date.now(), name: formType.trim(), data, descriptions: null });
      onClose();
    }

    const INP = { border:'1px solid rgb(210,214,220)', borderRadius:4, padding:'8px 10px', fontFamily:T.font, fontSize:13, color:T.textPrimary, outline:'none', width:'100%', boxSizing:'border-box' };

    return (
      <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(15,23,42,0.45)'}}></div>
        <div style={{position:'relative',background:'#fff',borderRadius:10,width:580,maxWidth:'95vw',boxShadow:'0 20px 60px rgba(0,0,0,0.2)',overflow:'hidden'}}>
          {/* Header */}
          <div style={{padding:'18px 24px',borderBottom:'1px solid '+T.border1,display:'flex',alignItems:'center',gap:12}}>
            <span style={{fontSize:16,fontWeight:600,color:T.textPrimary,flex:1}}>New Schema</span>
            <button onClick={onClose} style={{border:'none',background:'transparent',cursor:'pointer',fontSize:20,color:T.textMuted,lineHeight:1,padding:4}}>×</button>
          </div>
          {/* Mode tabs */}
          <div style={{display:'flex',gap:0,borderBottom:'1px solid '+T.border1}}>
            {[['json','Paste JSON'],['form','Fill in fields']].map(([k,lbl])=>(
              <button key={k} onClick={()=>{setMode(k);setJsonErr('');}} style={{flex:1,padding:'10px 16px',border:'none',background:'transparent',borderBottom:`2px solid ${mode===k?T.blue:'transparent'}`,color:mode===k?T.blue:T.textMuted,fontFamily:T.font,fontSize:13,fontWeight:mode===k?600:400,cursor:'pointer'}}>{lbl}</button>
            ))}
          </div>
          {/* Body */}
          <div style={{padding:'20px 24px'}}>
            {mode==='json' ? (
              <div>
                <div style={{fontSize:12,color:T.textMuted,marginBottom:8}}>Paste a complete JSON object for the schema. The event <code>type</code> field will be used as the schema name.</div>
                <textarea value={jsonText} onChange={e=>setJsonText(e.target.value)} placeholder={'{\n  "type": "es.entity.eligibility-request.MY_EVENT",\n  "source": "es/eligibility-request/123",\n  ...\n}'} rows={12}
                  style={{...INP,fontFamily:T.mono,fontSize:12,resize:'vertical',lineHeight:1.5}} />
                <div style={{marginTop:10,fontSize:12,color:T.textMuted}}>Schema name (optional — defaults to <code>type</code> field):</div>
                <input value={formName} onChange={e=>setFormName(e.target.value)} placeholder="e.g. ELIGIBILITY_REQUEST_SENT" style={{...INP,marginTop:6}} />
              </div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                <div>
                  <label style={{fontSize:12,fontWeight:500,color:T.textMuted,display:'block',marginBottom:5}}>Event Type Name *</label>
                  <input value={formType} onChange={e=>setFormType(e.target.value)} placeholder="es.entity.eligibility-request.MY_EVENT" style={INP} />
                </div>
                <div>
                  <label style={{fontSize:12,fontWeight:500,color:T.textMuted,display:'block',marginBottom:5}}>Source</label>
                  <input value={formSource} onChange={e=>setFormSource(e.target.value)} placeholder="es/eligibility-request/id" style={INP} />
                </div>
                <div style={{fontSize:12,color:T.textMuted}}>A minimal schema will be created with a <code>data</code> object. You can add fields in edit mode.</div>
              </div>
            )}
            {jsonErr && <div style={{marginTop:10,fontSize:12,color:T.danger,background:T.dangerBg,padding:'6px 10px',borderRadius:4}}>{jsonErr}</div>}
          </div>
          {/* Footer */}
          <div style={{padding:'14px 24px',borderTop:'1px solid '+T.border1,display:'flex',justifyContent:'flex-end',gap:10}}>
            <button onClick={onClose} style={{fontFamily:T.font,fontSize:13,padding:'7px 18px',border:'1px solid '+T.border1,borderRadius:4,background:'#fff',color:T.textMuted,cursor:'pointer'}}>Cancel</button>
            <button onClick={mode==='json'?handleJsonCreate:handleFormCreate}
              style={{fontFamily:T.font,fontSize:13,fontWeight:600,padding:'7px 20px',border:'none',borderRadius:4,background:T.blue,color:'#fff',cursor:'pointer'}}>Create Schema</button>
          </div>
        </div>
      </div>
    );
  }

  // ── Payload Accordion ─────────────────────────────────────────
  function PayloadAccordion({ data, depth }) {
    depth = depth || 0;
    if (data === null || data === undefined) return <span style={{color:T.textMuted,fontStyle:'italic',fontFamily:T.mono,fontSize:12}}>null</span>;
    if (typeof data !== 'object') {
      var c = typeof data==='string'?'rgb(39,105,102)':typeof data==='number'?'rgb(133,79,11)':'rgb(207,19,34)';
      return <span style={{fontFamily:T.mono,fontSize:12,color:c}}>{JSON.stringify(data)}</span>;
    }
    var isArr = Array.isArray(data);
    var entries = isArr ? data.map(function(v,i){return ['['+i+']',v];}) : Object.entries(data);
    return <div>{entries.map(function(entry,i){return <PayloadRow key={entry[0]+'_'+i} fieldKey={entry[0]} value={entry[1]} depth={depth} isLast={i===entries.length-1}/>;})}</div>;
  }
  function PayloadRow({ fieldKey, value, depth, isLast }) {
    var [open, setOpen] = useState(true);
    var isObj = value !== null && value !== undefined && typeof value === 'object';
    var isArr = isObj && Array.isArray(value);
    var indent = depth * 20;
    var type = getType(value);
    var tc = TYPE_COLORS[type] || {fg:T.textMuted, bg:T.surfaceAlt};
    var count = isObj ? (isArr ? value.length+' item'+(value.length!==1?'s':'') : Object.keys(value).length+' field'+(Object.keys(value).length!==1?'s':'')) : '';
    return (
      <div style={{borderBottom:isLast?'none':'1px solid '+T.border2}}>
        <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 16px 9px '+(16+indent)+'px',cursor:isObj?'pointer':'default',userSelect:'none'}}
          onClick={isObj?function(){setOpen(function(o){return !o;});}:undefined}>
          {isObj?(<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke={T.textMuted} strokeWidth="2.5" strokeLinecap="round" style={{transform:open?'none':'rotate(-90deg)',transition:'transform 0.13s',flexShrink:0}}><polyline points="6 9 12 15 18 9"/></svg>):<span style={{width:9,display:'inline-block',flexShrink:0}}/>}
          <span style={{fontFamily:T.mono,fontSize:12,fontWeight:isObj?600:400,color:isObj?T.blue:T.textPrimary,minWidth:160,flexShrink:0}}>{fieldKey}</span>
          {!isObj&&<span style={{fontFamily:T.mono,fontSize:12,color:tc.fg,background:tc.bg,padding:'1px 6px',borderRadius:3,maxWidth:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{value===null?'null':JSON.stringify(value)}</span>}
          {isObj&&<span style={{fontSize:11,color:T.textMuted,marginLeft:'auto'}}>{count}</span>}
        </div>
        {isObj&&open&&<div style={{borderLeft:'2px solid '+T.border2,marginLeft:(indent+20)+'px'}}><PayloadAccordion data={value} depth={depth+1}/></div>}
      </div>
    );
  }
  function PayloadPreview() {
    var [payloadData, setPayloadData] = useState(null);
    var [fileName, setFileName] = useState('');
    var [err, setErr] = useState('');
    var [dragOver, setDragOver] = useState(false);
    var fileRef = useRef(null);
    function handleFile(file) {
      if (!file) return; setFileName(file.name);
      var reader = new FileReader(); reader.onload = function(e) { try { setPayloadData(JSON.parse(e.target.result)); setErr(''); } catch(ex) { setErr('Invalid JSON: '+ex.message); setPayloadData(null); } }; reader.readAsText(file);
    }
    return !payloadData ? (
      <div style={{border:'2px dashed '+(dragOver?T.blue:T.border1),borderRadius:10,padding:'72px 24px',textAlign:'center',background:dragOver?T.blue25:'transparent',transition:'all 0.15s',cursor:'pointer'}}
        onDragOver={function(e){e.preventDefault();setDragOver(true);}} onDragLeave={function(){setDragOver(false);}}
        onDrop={function(e){e.preventDefault();setDragOver(false);handleFile(e.dataTransfer.files[0]);}}
        onClick={function(){fileRef.current&&fileRef.current.click();}}>
        <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={function(e){handleFile(e.target.files[0]);}}/>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke={T.textMuted} strokeWidth="1.5" strokeLinecap="round" style={{margin:'0 auto 12px',display:'block'}}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <div style={{fontSize:15,fontWeight:600,color:T.textPrimary,marginBottom:4}}>Upload a JSON payload</div>
        <div style={{fontSize:12,color:T.textMuted}}>Drag & drop or click to browse · .json files only</div>
        {err&&<div style={{marginTop:12,fontSize:12,color:T.danger,background:T.dangerBg,padding:'6px 12px',borderRadius:4,display:'inline-block'}}>{err}</div>}
      </div>
    ) : (
      <div>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,padding:'10px 16px',background:T.surfaceAlt,borderRadius:8,border:'1px solid '+T.border1}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={T.blue} strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span style={{fontSize:13,fontFamily:T.mono,color:T.textPrimary,flex:1}}>{fileName}</span>
          <button onClick={function(){setPayloadData(null);setFileName('');setErr('');}} style={{border:'1px solid '+T.border1,background:'#fff',cursor:'pointer',color:T.textMuted,fontSize:12,padding:'3px 10px',borderRadius:3,fontFamily:T.font}}>× Clear</button>
        </div>
        <div style={{background:T.surface,border:'1px solid '+T.border1,borderRadius:12,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}><PayloadAccordion data={payloadData} depth={0}/></div>
      </div>
    );
  }

  // ── Compare View ──────────────────────────────────────────────
  function CompareView({ schemas }) {
    var [leftIdx, setLeftIdx] = useState(0);
    var [rightIdx, setRightIdx] = useState(Math.min(1, schemas.length-1));
    var [leftCustom, setLeftCustom] = useState(null);
    var [rightCustom, setRightCustom] = useState(null);
    var [leftName, setLeftName] = useState('');
    var [rightName, setRightName] = useState('');
    function handleUpload(side, file) {
      if (!file) return;
      var reader = new FileReader(); reader.onload = function(e) { try { var p=JSON.parse(e.target.result); if(side==='left'){setLeftCustom(p);setLeftIdx(-1);setLeftName(file.name);}else{setRightCustom(p);setRightIdx(-1);setRightName(file.name);} } catch(ex){} }; reader.readAsText(file);
    }
    function flatten(obj, prefix) {
      prefix = prefix||''; if(obj===null||obj===undefined) return prefix?{[prefix]:obj}:{};
      if(typeof obj!=='object') return {[prefix]:obj};
      var res={};
      if(Array.isArray(obj)) obj.forEach(function(v,i){Object.assign(res,flatten(v,prefix+'['+i+']'));});
      else Object.entries(obj).forEach(function([k,v]){var p=prefix?prefix+'.'+k:k;if(v!==null&&typeof v==='object')Object.assign(res,flatten(v,p));else res[p]=v;});
      return res;
    }
    var leftData = leftIdx===-1?leftCustom:(schemas[leftIdx]&&schemas[leftIdx].data);
    var rightData = rightIdx===-1?rightCustom:(schemas[rightIdx]&&schemas[rightIdx].data);
    var lFlat=leftData?flatten(leftData):{}, rFlat=rightData?flatten(rightData):{};
    var allKeys=Array.from(new Set(Object.keys(lFlat).concat(Object.keys(rFlat)))).sort();
    var diffs=allKeys.map(function(k){var lv=lFlat[k],rv=rFlat[k],inL=k in lFlat,inR=k in rFlat,st=!inL?'added':!inR?'removed':JSON.stringify(lv)!==JSON.stringify(rv)?'changed':'same';return{key:k,leftVal:lv,rightVal:rv,inLeft:inL,inRight:inR,status:st};});
    var changed=diffs.filter(function(d){return d.status!=='same';});
    var added=diffs.filter(function(d){return d.status==='added';}).length;
    var removed=diffs.filter(function(d){return d.status==='removed';}).length;
    var modified=diffs.filter(function(d){return d.status==='changed';}).length;
    var SC={added:{bg:'rgb(240,255,244)',bd:'rgb(180,230,190)',c:'rgb(22,110,52)',lbl:'Added'},removed:{bg:'rgb(255,244,244)',bd:'rgb(240,180,180)',c:'rgb(180,30,30)',lbl:'Removed'},changed:{bg:'rgb(255,248,235)',bd:'rgb(240,210,150)',c:'rgb(133,79,11)',lbl:'Changed'}};
    var SEL={fontFamily:T.font,fontSize:12,padding:'5px 8px',border:'1px solid '+T.border1,borderRadius:4,background:'#fff',color:T.textPrimary,cursor:'pointer'};
    var lLabel=leftIdx===-1?(leftName||'Uploaded'):(schemas[leftIdx]&&schemas[leftIdx].name)||'Schema';
    var rLabel=rightIdx===-1?(rightName||'Uploaded'):(schemas[rightIdx]&&schemas[rightIdx].name)||'Schema';
    return (
      <div>
        <div style={{display:'flex',gap:12,marginBottom:20,alignItems:'center',flexWrap:'wrap',background:T.surfaceAlt,padding:'12px 16px',borderRadius:8,border:'1px solid '+T.border1}}>
          <span style={{fontSize:11,fontWeight:700,color:T.textMuted,textTransform:'uppercase',letterSpacing:'0.05em'}}>Left</span>
          <select value={leftIdx} onChange={function(e){setLeftIdx(Number(e.target.value));}} style={SEL}>{schemas.map(function(s,i){return <option key={s.id} value={i}>{s.name}</option>;})}{leftIdx===-1&&<option value={-1}>{leftName||'Uploaded'}</option>}</select>
          <label style={{fontSize:11,color:T.blue,cursor:'pointer',border:'1px solid '+T.blue,borderRadius:3,padding:'4px 9px',whiteSpace:'nowrap',fontFamily:T.font,fontWeight:500}}>Upload JSON<input type="file" accept=".json" style={{display:'none'}} onChange={function(e){handleUpload('left',e.target.files[0]);}}/></label>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.textMuted} strokeWidth="1.5" strokeLinecap="round" style={{margin:'0 4px'}}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          <span style={{fontSize:11,fontWeight:700,color:T.textMuted,textTransform:'uppercase',letterSpacing:'0.05em'}}>Right</span>
          <select value={rightIdx} onChange={function(e){setRightIdx(Number(e.target.value));}} style={SEL}>{schemas.map(function(s,i){return <option key={s.id} value={i}>{s.name}</option>;})}{rightIdx===-1&&<option value={-1}>{rightName||'Uploaded'}</option>}</select>
          <label style={{fontSize:11,color:T.blue,cursor:'pointer',border:'1px solid '+T.blue,borderRadius:3,padding:'4px 9px',whiteSpace:'nowrap',fontFamily:T.font,fontWeight:500}}>Upload JSON<input type="file" accept=".json" style={{display:'none'}} onChange={function(e){handleUpload('right',e.target.files[0]);}}/></label>
          {changed.length>0&&<div style={{display:'flex',gap:8,marginLeft:'auto'}}>{[['Added',added,'rgb(22,110,52)','rgb(240,255,244)'],['Removed',removed,'rgb(180,30,30)','rgb(255,244,244)'],['Changed',modified,'rgb(133,79,11)','rgb(255,248,235)']].map(function(item){return <span key={item[0]} style={{fontSize:12,fontWeight:600,color:item[2],background:item[3],padding:'3px 10px',borderRadius:10}}>{item[1]} {item[0]}</span>;})}</div>}
        </div>
        <div style={{background:T.surface,border:'1px solid '+T.border1,borderRadius:12,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
          <div style={{display:'grid',gridTemplateColumns:'1.2fr 1fr 1fr',borderBottom:'2px solid '+T.border1,background:'rgb(247,249,252)'}}>
            <div style={{padding:'10px 16px',fontSize:11,fontWeight:600,color:T.textMuted,textTransform:'uppercase',letterSpacing:'0.06em',borderRight:'1px solid '+T.border2}}>Field path</div>
            <div style={{padding:'10px 16px',fontSize:11,fontWeight:600,color:T.textMuted,textTransform:'uppercase',letterSpacing:'0.06em',borderRight:'1px solid '+T.border2}}>{lLabel}</div>
            <div style={{padding:'10px 16px',fontSize:11,fontWeight:600,color:T.textMuted,textTransform:'uppercase',letterSpacing:'0.06em'}}>{rLabel}</div>
          </div>
          {!leftData||!rightData?(<div style={{padding:'32px 16px',textAlign:'center',color:T.textMuted,fontSize:13}}>Select or upload both schemas to see diff.</div>):changed.length===0?(<div style={{padding:'32px 16px',textAlign:'center',color:'rgb(22,110,52)',fontSize:13,fontWeight:500}}>✓ Schemas are identical across all {allKeys.length} fields</div>):changed.map(function(d,i){var sc=SC[d.status];return(
            <div key={d.key} style={{display:'grid',gridTemplateColumns:'1.2fr 1fr 1fr',borderBottom:i<changed.length-1?'1px solid '+T.border2:'none',background:sc.bg}}>
              <div style={{padding:'10px 16px',borderRight:'1px solid '+T.border2,display:'flex',alignItems:'flex-start',gap:8}}><span style={{fontFamily:T.mono,fontSize:11,color:T.textPrimary,wordBreak:'break-all',flex:1}}>{d.key}</span><span style={{fontSize:10,fontWeight:600,color:sc.c,border:'1px solid '+sc.bd,borderRadius:3,padding:'1px 5px',whiteSpace:'nowrap',flexShrink:0}}>{sc.lbl}</span></div>
              <div style={{padding:'10px 16px',borderRight:'1px solid '+T.border2,fontFamily:T.mono,fontSize:11,color:d.inLeft?T.textPrimary:'rgb(185,188,194)',fontStyle:d.inLeft?'normal':'italic',wordBreak:'break-all'}}>{d.inLeft?JSON.stringify(d.leftVal):'—'}</div>
              <div style={{padding:'10px 16px',fontFamily:T.mono,fontSize:11,color:d.inRight?T.textPrimary:'rgb(185,188,194)',fontStyle:d.inRight?'normal':'italic',wordBreak:'break-all'}}>{d.inRight?JSON.stringify(d.rightVal):'—'}</div>
            </div>
          );})}
        </div>
        <div style={{marginTop:8,fontSize:11,color:T.textMuted,textAlign:'right'}}>{allKeys.length} total fields · {changed.length} diff{changed.length!==1?'s':''}</div>
      </div>
    );
  }


  // ── Compare Screen (GitHub PR diff) ──────────────────────────
  function CompareScreen({ schemas }) {
    var [compareMode, setCompareMode] = useState('schemas');
    var [leftSchemaIdx, setLeftSchemaIdx] = useState(-1);
    var [rightSchemaIdx, setRightSchemaIdx] = useState(-1);
    var [leftPayText, setLeftPayText] = useState('');
    var [rightPayText, setRightPayText] = useState('');
    var [leftPayData, setLeftPayData] = useState(null);
    var [rightPayData, setRightPayData] = useState(null);
    var [leftPayErr, setLeftPayErr] = useState('');
    var [rightPayErr, setRightPayErr] = useState('');
    var leftPayRef = useRef(null);
    var rightPayRef = useRef(null);
    var leftScrollRef = useRef(null);
    var rightScrollRef = useRef(null);
    var syncingScroll = useRef(false);

    // Sync scroll between panels
    function makeSyncHandler(otherRef) {
      return function(e) {
        if (syncingScroll.current) return;
        syncingScroll.current = true;
        if (otherRef.current) otherRef.current.scrollTop = e.target.scrollTop;
        syncingScroll.current = false;
      };
    }

    function tryParsePayload(text, side) {
      if (!text.trim()) { if(side==='left'){setLeftPayData(null);setLeftPayErr('');}else{setRightPayData(null);setRightPayErr('');} return; }
      try { var p=JSON.parse(text); if(side==='left'){setLeftPayData(p);setLeftPayErr('');}else{setRightPayData(p);setRightPayErr('');} }
      catch(e) { if(side==='left'){setLeftPayErr(e.message);setLeftPayData(null);}else{setRightPayErr(e.message);setRightPayData(null);} }
    }
    function handlePayFile(side, file) {
      if(!file) return;
      var reader=new FileReader(); reader.onload=function(e){var t=e.target.result; if(side==='left'){setLeftPayText(t);tryParsePayload(t,'left');}else{setRightPayText(t);tryParsePayload(t,'right');}};reader.readAsText(file);
    }
    function clearSide(side) {
      if(side==='left'){setLeftSchemaIdx(-1);setLeftPayText('');setLeftPayData(null);setLeftPayErr('');}
      else{setRightSchemaIdx(-1);setRightPayText('');setRightPayData(null);setRightPayErr('');}
    }

    var leftData = compareMode==='schemas'?(leftSchemaIdx>=0?schemas[leftSchemaIdx]&&schemas[leftSchemaIdx].data:null):leftPayData;
    var rightData = compareMode==='schemas'?(rightSchemaIdx>=0?schemas[rightSchemaIdx]&&schemas[rightSchemaIdx].data:null):rightPayData;
    var leftLabel = leftSchemaIdx>=0?(schemas[leftSchemaIdx]&&schemas[leftSchemaIdx].name)||'Before':'Before';
    var rightLabel = rightSchemaIdx>=0?(schemas[rightSchemaIdx]&&schemas[rightSchemaIdx].name)||'After':'After';

    function flatten(obj, prefix) {
      prefix=prefix||''; if(obj===null||obj===undefined) return prefix?{[prefix]:obj}:{};
      if(typeof obj!=='object') return {[prefix]:obj};
      var res={};
      if(Array.isArray(obj)) obj.forEach(function(v,i){Object.assign(res,flatten(v,prefix+'['+i+']'));});
      else Object.entries(obj).forEach(function([k,v]){var p=prefix?prefix+'.'+k:k;if(v!==null&&typeof v==='object')Object.assign(res,flatten(v,p));else res[p]=v;});
      return res;
    }

    var lFlat=leftData?flatten(leftData):{};
    var rFlat=rightData?flatten(rightData):{};
    var hasBoth=!!(leftData&&rightData);

    // Build unified key list — union of both sides, preserving order
    var allKeys=Array.from(new Set(Object.keys(lFlat).concat(Object.keys(rFlat)))).sort();

    // Build rows: one per key, with status
    var rows=allKeys.map(function(k){
      var lv=lFlat[k], rv=rFlat[k], inL=k in lFlat, inR=k in rFlat;
      var st = !hasBoth ? (inL?'left-only':'right-only') : (!inL?'added':!inR?'removed':JSON.stringify(lv)!==JSON.stringify(rv)?'changed':'same');
      return {key:k, lv:lv, rv:rv, inL:inL, inR:inR, st:st};
    });

    // Single-side: show left or right keys only
    var leftRows = leftData ? (hasBoth ? rows : Object.keys(lFlat).sort().map(function(k){return{key:k,lv:lFlat[k],inL:true,inR:false,st:'left-only'};})) : [];
    var rightRows = rightData ? (hasBoth ? rows : Object.keys(rFlat).sort().map(function(k){return{key:k,rv:rFlat[k],inL:false,inR:true,st:'right-only'};})) : [];

    var displayRows = hasBoth ? rows : (leftRows.length>0?leftRows:rightRows);
    var added=hasBoth?rows.filter(function(r){return r.st==='added';}).length:0;
    var removed=hasBoth?rows.filter(function(r){return r.st==='removed';}).length:0;
    var changed=hasBoth?rows.filter(function(r){return r.st==='changed';}).length:0;
    var totalFields = allKeys.length;

    var ROW_H=34; var MONO=T.mono;
    var SEL_S={fontFamily:T.font,fontSize:11,padding:'3px 6px',border:'1px solid '+T.border1,borderRadius:3,background:'#fff',color:T.textPrimary,cursor:'pointer',maxWidth:180};
    var TA_S={flex:1,fontFamily:MONO,fontSize:12,padding:12,border:'1px solid '+T.border1,borderRadius:4,outline:'none',resize:'none',color:T.textPrimary,lineHeight:1.6,background:'#fff',marginTop:8};
    var LN_W=38; // line number gutter width

    function rowBgLeft(st) {
      if(!hasBoth) return 'transparent';
      return st==='removed'?'rgb(255,235,235)':st==='changed'?'rgb(255,251,235)':'transparent';
    }
    function rowBgRight(st) {
      if(!hasBoth) return 'transparent';
      return st==='added'?'rgb(235,255,240)':st==='changed'?'rgb(235,255,240)':'transparent';
    }
    function valFgLeft(st) { return hasBoth&&st==='removed'?'rgb(160,30,30)':T.textPrimary; }
    function valFgRight(st) { return hasBoth&&(st==='added'||st==='changed')?'rgb(22,110,52)':T.textPrimary; }
    function keyFgLeft(st) { return hasBoth&&st==='removed'?'rgb(160,30,30)':T.textBody; }
    function keyFgRight(st) { return hasBoth&&st==='added'?'rgb(22,110,52)':T.textBody; }

    function SideHeader({side}) {
      var schemaIdx=side==='left'?leftSchemaIdx:rightSchemaIdx;
      var setSchemaIdx=side==='left'?setLeftSchemaIdx:setRightSchemaIdx;
      var payErr=side==='left'?leftPayErr:rightPayErr;
      var payRef=side==='left'?leftPayRef:rightPayRef;
      var label=side==='left'?leftLabel:rightLabel;
      var hasData=side==='left'?(leftData!==null):(rightData!==null);
      return (
        <div style={{padding:'10px 14px',background:'rgb(247,249,252)',borderBottom:'1px solid '+T.border2,flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
            <span style={{fontSize:12,fontWeight:700,color:T.textPrimary,fontFamily:MONO,flex:1}}>{label}</span>
            {hasData&&<button onClick={()=>clearSide(side)} style={{fontSize:11,color:T.textMuted,border:'1px solid '+T.border1,borderRadius:3,padding:'1px 6px',background:'#fff',cursor:'pointer',fontFamily:T.font}}>Clear</button>}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
            <select value={schemaIdx} onChange={function(e){setSchemaIdx(Number(e.target.value));}} style={SEL_S}>
              <option value={-1}>— Select schema —</option>
              {schemas.map(function(s,i){return <option key={s.id} value={i}>{s.name}</option>;})}
            </select>
            {compareMode==='payloads'&&(
              <>
                <span style={{fontSize:10,color:T.textMuted}}>·</span>
                <label style={{fontSize:11,color:T.blue,cursor:'pointer',border:'1px solid '+T.blue,borderRadius:3,padding:'2px 8px',fontFamily:T.font,fontWeight:500,whiteSpace:'nowrap'}}>
                  Upload payload<input type="file" accept=".json" style={{display:'none'}} ref={payRef} onChange={function(e){handlePayFile(side,e.target.files[0]);}}/>
                </label>
                {payErr&&<span style={{fontSize:10,color:T.danger,marginLeft:4}}>{payErr}</span>}
              </>
            )}
          </div>
          {compareMode==='payloads'&&!(side==='left'?leftPayData:rightPayData)&&(
            <textarea value={side==='left'?leftPayText:rightPayText}
              onChange={function(e){var t=e.target.value;side==='left'?(setLeftPayText(t),tryParsePayload(t,'left')):(setRightPayText(t),tryParsePayload(t,'right'));}}
              placeholder="Paste payload JSON…" style={TA_S}/>
          )}
        </div>
      );
    }

    function TableHeader({label}) {
      return (
        <div style={{display:'grid',gridTemplateColumns:LN_W+'px 1fr 1fr',position:'sticky',top:0,zIndex:2,background:'rgb(247,249,252)',borderBottom:'1px solid '+T.border1}}>
          <div style={{background:'rgb(240,242,245)',borderRight:'1px solid '+T.border2}}/>
          <div style={{padding:'6px 12px',fontSize:10,fontWeight:700,color:T.textMuted,textTransform:'uppercase',letterSpacing:'0.06em',borderRight:'1px solid '+T.border2}}>Field path</div>
          <div style={{padding:'6px 12px',fontSize:10,fontWeight:700,color:T.textMuted,textTransform:'uppercase',letterSpacing:'0.06em'}}>{label}</div>
        </div>
      );
    }

    function PanelRows({side, scrollRef}) {
      var rowsToRender = side==='left'?
        (hasBoth?rows:(leftData?rows:[])):
        (hasBoth?rows:(rightData?rows:[]));
      var hasThisSide = side==='left'?!!leftData:!!rightData;
      if (!hasThisSide) {
        return <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:T.textMuted,fontSize:13,padding:24,textAlign:'center'}}>
          {compareMode==='schemas'?'Select a schema above.':'Upload or paste a payload above.'}
        </div>;
      }
      return (
        <div ref={scrollRef} onScroll={makeSyncHandler(side==='left'?rightScrollRef:leftScrollRef)} style={{flex:1,overflowY:'auto'}}>
          {rowsToRender.map(function(row,i){
            var isLeft=side==='left'; var ln=i+1;
            var inSide=isLeft?row.inL:row.inR;
            var val=isLeft?row.lv:row.rv;
            var bg=isLeft?rowBgLeft(row.st):rowBgRight(row.st);
            var vfg=isLeft?valFgLeft(row.st):valFgRight(row.st);
            var kfg=isLeft?keyFgLeft(row.st):keyFgRight(row.st);
            var showBlank=hasBoth&&(isLeft?!row.inL:!row.inR);
            return (
              <div key={row.key+i} style={{display:'grid',gridTemplateColumns:LN_W+'px 1fr 1fr',borderBottom:'1px solid '+T.border2,background:showBlank?'rgb(245,246,248)':bg,minHeight:ROW_H}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',padding:'0 8px',background:'rgb(240,242,245)',borderRight:'1px solid '+T.border2,color:'rgb(180,184,192)',fontSize:10,fontFamily:MONO,userSelect:'none',flexShrink:0}}>{ln}</div>
                <div style={{height:ROW_H,display:'flex',alignItems:'center',padding:'0 12px',borderRight:'1px solid '+T.border2,overflow:'hidden'}}><span style={{fontFamily:MONO,fontSize:11,color:kfg,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{row.key}</span></div>
                <div style={{height:ROW_H,display:'flex',alignItems:'center',padding:'0 12px',overflow:'hidden'}}>
                  {showBlank?<span style={{color:T.border2,fontSize:12}}>—</span>:inSide?<span style={{fontFamily:MONO,fontSize:11,color:vfg,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{JSON.stringify(val)}</span>:<span style={{color:T.border2,fontSize:12}}>—</span>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    return (
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
        {/* Mode toggle + counters */}
        <div style={{padding:'10px 20px',background:'#fff',borderBottom:'1px solid '+T.border1,display:'flex',alignItems:'center',gap:12,flexShrink:0,flexWrap:'wrap'}}>
          <div style={{display:'flex',border:'1px solid rgb(210,214,220)',borderRadius:5,overflow:'hidden'}}>
            {[['schemas','Compare Schemas'],['payloads','Compare Payloads']].map(function([id,lbl],idx,arr){return(
              <button key={id} onClick={()=>setCompareMode(id)}
                style={{fontFamily:T.font,fontSize:12,fontWeight:500,padding:'5px 14px',border:'none',background:compareMode===id?T.blue:'#fff',color:compareMode===id?'#fff':T.textMuted,cursor:'pointer',borderRight:idx<arr.length-1?'1px solid rgb(210,214,220)':'none',transition:'all 0.12s'}}>
                {lbl}
              </button>
            );})}
          </div>
          {(leftData||rightData)&&(
            <div style={{display:'flex',gap:10,marginLeft:'auto',alignItems:'center',flexWrap:'wrap'}}>
              {hasBoth&&<><span style={{fontSize:12,fontWeight:600,color:'rgb(22,110,52)',background:'rgb(235,255,240)',padding:'2px 10px',borderRadius:10}}>{added} Added</span>
              <span style={{fontSize:12,fontWeight:600,color:'rgb(160,30,30)',background:'rgb(255,235,235)',padding:'2px 10px',borderRadius:10}}>{removed} Removed</span>
              <span style={{fontSize:12,fontWeight:600,color:'rgb(133,79,11)',background:'rgb(255,251,235)',padding:'2px 10px',borderRadius:10}}>{changed} Changed</span></>}
              <span style={{fontSize:11,color:T.textMuted}}>{totalFields} field{totalFields!==1?'s':''}</span>
            </div>
          )}
        </div>
        {/* Two panels */}
        <div style={{flex:1,display:'flex',overflow:'hidden',minHeight:0}}>
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',borderRight:'1px solid '+T.border1}}>
            <SideHeader side="left"/>
            {leftData&&<TableHeader label={leftLabel}/>}
            <PanelRows side="left" scrollRef={leftScrollRef}/>
          </div>
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
            <SideHeader side="right"/>
            {rightData&&<TableHeader label={rightLabel}/>}
            <PanelRows side="right" scrollRef={rightScrollRef}/>
          </div>
        </div>
      </div>
    );
  }


  // ── Save Modal (token never stored in source) ─────────────────
  function SaveModal({ schemas, dataVersion, onClose, onSaved, onReload }) {
    var [token, setToken] = useState(function(){ try{return sessionStorage.getItem('__gist_tok')||'';}catch(e){return '';} });
    var [remember, setRemember] = useState(false);
    var [phase, setPhase] = useState('form'); // form|checking|conflict|saving|saved|error
    var [savedAt, setSavedAt] = useState('');
    var [errMsg, setErrMsg] = useState('');
    var [conflictTime, setConflictTime] = useState('');
    var tokenRef = useRef(token);
    tokenRef.current = token;

    async function doSave(force) {
      var tok = tokenRef.current.trim();
      if (!tok) { setErrMsg('A GitHub token is required.'); return; }
      setErrMsg('');
      if (!force) {
        setPhase('checking');
        try {
          var check = await gistCheckRevision(tok);
          if (check.changed) { setConflictTime(check.updatedAt); setPhase('conflict'); return; }
        } catch(e) { /* proceed */ }
      }
      setPhase('saving');
      try {
        var result = await gistSaveWithToken(schemas, tok, dataVersion);
        try { if (remember) sessionStorage.setItem('__gist_tok', tok); else sessionStorage.removeItem('__gist_tok'); } catch(e){}
        setSavedAt(result.updated_at || new Date().toISOString());
        setPhase('saved');
        if (onSaved) onSaved(result);
      } catch(e) { setErrMsg(e.message); setPhase('error'); }
    }

    var INP = { fontFamily:T.mono, fontSize:13, padding:'8px 10px', border:'1px solid '+T.border1, borderRadius:5, color:T.textPrimary, outline:'none', width:'100%', boxSizing:'border-box' };
    var SAVING = phase==='checking'||phase==='saving';

    return (
      <div style={{position:'fixed',inset:0,zIndex:400,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(15,23,42,0.5)'}}/>
        <div style={{position:'relative',background:'#fff',borderRadius:12,width:520,maxWidth:'96vw',boxShadow:'0 24px 64px rgba(0,0,0,0.22)',overflow:'hidden'}}>
          {/* Header */}
          <div style={{padding:'18px 24px 14px',borderBottom:'1px solid '+T.border1,display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:36,height:36,borderRadius:8,background:T.blue25,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.blue} strokeWidth="2" strokeLinecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <span style={{fontSize:15,fontWeight:600,color:T.textPrimary,flex:1}}>Save to Gist</span>
            <button onClick={onClose} style={{border:'none',background:'transparent',cursor:'pointer',fontSize:20,color:T.textMuted,lineHeight:1,padding:4}}>×</button>
          </div>

          {/* Body */}
          <div style={{padding:'20px 24px'}}>
            {phase==='conflict'?(
              <div>
                <div style={{padding:'12px 14px',background:'rgb(255,248,235)',border:'1px solid rgb(240,200,120)',borderRadius:6,marginBottom:16}}>
                  <div style={{fontWeight:600,color:'rgb(133,79,11)',marginBottom:4}}>⚠ Conflict detected</div>
                  <div style={{fontSize:13,color:T.textBody,lineHeight:1.5}}>The Gist was updated externally ({new Date(conflictTime).toLocaleString()}) since you loaded it. Your changes have not been saved.</div>
                </div>
                <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                  <button onClick={onReload} style={{fontFamily:T.font,fontSize:13,padding:'7px 16px',border:'1px solid '+T.border1,borderRadius:4,background:'#fff',color:T.textPrimary,cursor:'pointer'}}>Reload latest</button>
                  <button onClick={()=>doSave(true)} style={{fontFamily:T.font,fontSize:13,fontWeight:600,padding:'7px 16px',border:'none',borderRadius:4,background:'rgb(207,100,0)',color:'#fff',cursor:'pointer'}}>Overwrite anyway</button>
                </div>
              </div>
            ):phase==='saved'?(
              <div style={{textAlign:'center',padding:'12px 0 4px'}}>
                <div style={{width:48,height:48,borderRadius:'50%',background:'rgb(235,255,240)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgb(22,110,52)" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <div style={{fontSize:15,fontWeight:600,color:'rgb(22,110,52)',marginBottom:4}}>Saved successfully</div>
                <div style={{fontSize:12,color:T.textMuted}}>Gist updated at {new Date(savedAt).toLocaleString()}</div>
              </div>
            ):(
              <div>
                <div style={{fontSize:13,color:T.textBody,lineHeight:1.55,marginBottom:14}}>
                  A GitHub token with <code style={{background:'rgb(240,242,246)',padding:'1px 5px',borderRadius:3,fontSize:12}}>gist</code> scope is required.{' '}
                  <a href="https://github.com/settings/tokens/new?scopes=gist&description=API+Schema+Gist+Save" target="_blank" rel="noopener" style={{color:T.blue}}>Create one →</a>
                </div>
                <input type="password" value={token} onChange={function(e){setToken(e.target.value);}} placeholder="ghp_…" style={INP} autoFocus/>
                <div style={{fontSize:11,color:T.textMuted,marginTop:7,lineHeight:1.5}}>Used only for this save. Kept in memory this session. <strong>Never stored in source or committed.</strong></div>
                <label style={{display:'flex',alignItems:'center',gap:8,marginTop:12,fontSize:13,color:T.textBody,cursor:'pointer'}}>
                  <input type="checkbox" checked={remember} onChange={function(e){setRemember(e.target.checked);}} style={{width:14,height:14,accentColor:T.blue}}/>
                  Remember for this tab (sessionStorage only, cleared on tab close)
                </label>
                {errMsg&&<div style={{marginTop:12,fontSize:12,color:T.danger,background:T.dangerBg,padding:'7px 10px',borderRadius:4}}>{errMsg}</div>}
                {phase==='error'&&!errMsg&&<div style={{marginTop:12,fontSize:12,color:T.danger,background:T.dangerBg,padding:'7px 10px',borderRadius:4}}>Save failed. Check your token and try again.</div>}
              </div>
            )}
          </div>

          {/* Footer */}
          {phase!=='conflict'&&phase!=='saved'&&(
            <div style={{padding:'12px 24px',borderTop:'1px solid '+T.border1,display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button onClick={onClose} style={{fontFamily:T.font,fontSize:13,padding:'7px 18px',border:'1px solid '+T.border1,borderRadius:4,background:'#fff',color:T.textMuted,cursor:'pointer'}}>Cancel</button>
              <button onClick={()=>doSave(false)} disabled={SAVING}
                style={{fontFamily:T.font,fontSize:13,fontWeight:600,padding:'7px 20px',border:'none',borderRadius:4,background:SAVING?'rgb(130,170,240)':T.blue,color:'#fff',cursor:SAVING?'default':'pointer',transition:'background 0.12s'}}>
                {phase==='checking'?'Checking…':phase==='saving'?'Saving…':'Save to Gist'}
              </button>
            </div>
          )}
          {phase==='saved'&&(
            <div style={{padding:'12px 24px',borderTop:'1px solid '+T.border1,display:'flex',justifyContent:'flex-end'}}>
              <button onClick={onClose} style={{fontFamily:T.font,fontSize:13,fontWeight:600,padding:'7px 20px',border:'none',borderRadius:4,background:T.blue,color:'#fff',cursor:'pointer'}}>Done</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ── Main ─────────────────────────────────────────────────────
  function ApiSchemaViewer() {
    const [syncStatus, setSyncStatus] = useState('idle');
    const [schemas, setSchemas] = useState([{ id:'s1', name:INITIAL_DATA.type, data:INITIAL_DATA, descriptions:Object.assign({},BASE_DESCRIPTIONS) }, { id:'s2', name:'Commercial + Medicare', data:COMMERCIAL_MEDICARE_DATA, descriptions:Object.assign({},BASE_DESCRIPTIONS) }, { id:'s3', name:'Unified', data:UNIFIED_DATA, descriptions:Object.assign({},BASE_DESCRIPTIONS) }]);
    const [activeIdx, setActiveIdx] = useState(0);
    const [newSchemaOpen, setNewSchemaOpen] = useState(false);

    const [data, setData] = useState(INITIAL_DATA);
    // Sync active schema data when switching tabs
    useEffect(function() {
      const s = schemas[activeIdx]; if(!s) return;
      setData(s.data||{}); setDescriptions(Object.assign({},BASE_DESCRIPTIONS,s.descriptions||{})); setDraft(null); setDraftDescs(null);
    }, [activeIdx]);

    // Always load from Gist on mount
    useEffect(function() {
      setSyncStatus('syncing');
      gistLoad().then(function(bundle) {
        if (bundle && bundle.__v2 && bundle.schemas && bundle.schemas.length) {
          // If Gist data is from an older version, discard and use local data
          if (bundle.__dataVersion !== DATA_VERSION) {
            const local = [{ id:'s1', name:INITIAL_DATA.type, data:INITIAL_DATA, descriptions:Object.assign({},BASE_DESCRIPTIONS) }, { id:'s2', name:'Commercial + Medicare', data:COMMERCIAL_MEDICARE_DATA, descriptions:Object.assign({},BASE_DESCRIPTIONS) }, { id:'s3', name:'Unified', data:UNIFIED_DATA, descriptions:Object.assign({},BASE_DESCRIPTIONS) }];
            setSchemas(local); setData(local[0].data||{}); setDescriptions(Object.assign({},BASE_DESCRIPTIONS));
            gistSave(local, DATA_VERSION);
            setSyncStatus('idle'); return;
          }
          var loaded = bundle.schemas;
          var hasCommercial = loaded.some(function(s){ return s.id==='s2'||s.name==='Commercial + Medicare'; });
          if (!hasCommercial) {
            loaded = loaded.concat([{ id:'s2', name:'Commercial + Medicare', data:COMMERCIAL_MEDICARE_DATA, descriptions:Object.assign({},BASE_DESCRIPTIONS) }]);
          }
          var hasUnified = loaded.some(function(s){ return s.id==='s3'||s.name==='Unified'; });
          if (!hasUnified) {
            loaded = loaded.concat([{ id:'s3', name:'Unified', data:UNIFIED_DATA, descriptions:Object.assign({},BASE_DESCRIPTIONS) }]);
          }
          if (!hasCommercial || !hasUnified) gistSave(loaded, DATA_VERSION);
          setSchemas(loaded);
          const s0=loaded[0]; setData(s0.data||{}); setDescriptions(Object.assign({},BASE_DESCRIPTIONS,s0.descriptions||{}));
          setSyncStatus('idle');
        } else {
          fetch('./api-schema-data.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){setData(d);}).catch(function(){});
          setSyncStatus('idle');
        }
      }).catch(function(){ setSyncStatus('error'); });
    }, []);
    const [draft, setDraft] = useState(null);
    const [descriptions, setDescriptions] = useState(Object.assign({}, BASE_DESCRIPTIONS));
    const [draftDescs, setDraftDescs] = useState(null);
    const [editMode, setEditMode] = useState(false);
    const [viewMode, setViewMode] = useState('table');
    const [forceOpen, setForceOpen] = useState(null);
    const [treeKey, setTreeKey] = useState(0);
    const [editingMeta, setEditingMeta] = useState(false);
    const [metaDraft, setMetaDraft] = useState(null);
    const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
    const [showSaveModal, setShowSaveModal] = useState(false);
    const [pendingSaveSchemas, setPendingSaveSchemas] = useState(null);
    const [activeTab, setActiveTab] = useState('schema');
    const [payloadOpen, setPayloadOpen] = useState(false);
    const [payloadWidth, setPayloadWidth] = useState(440);
    const [schemaDropOpen, setSchemaDropOpen] = useState(false);
    const [viewAsDropOpen, setViewAsDropOpen] = useState(false);
    const [actionDropOpen, setActionDropOpen] = useState(false);
    const isDraggingPayload = useRef(false);
    const dragStartX = useRef(0);
    const dragStartW = useRef(440);

    const displayData = draft!==null?draft:data;
    const displayDescs = draftDescs!==null?draftDescs:descriptions;
    const hasDraft = draft!==null;
    const meta = metaDraft||{source:displayData.source,eventId:displayData.id,time:displayData.time,specversion:displayData.specversion,typeName:displayData.type,schemaName:schemas[activeIdx]&&schemas[activeIdx].name||''};

    function mutateDraft(fn){setDraft(prev=>fn(prev!==null?prev:data));}
    function handleDelete(path){mutateDraft(d=>deleteNested(d,path));}
    function handleAdd(path,key,value,desc){
      mutateDraft(d=>addNested(d,path,key,value));
      if(desc) setDraftDescs(prev=>Object.assign({},prev!==null?prev:descriptions,{[key]:desc}));
    }
    function handleSaveRow(path, oldKey, newKey, newValue, newDesc) {
      mutateDraft(d => {
        let updated = setNested(d, path, newValue);
        if (newKey !== oldKey && !oldKey.startsWith('[')) updated = renameNested(updated, path, newKey);
        return updated;
      });
      const descKey = newKey !== oldKey ? newKey : oldKey;
      setDraftDescs(prev => Object.assign({}, prev!==null?prev:descriptions, {[descKey]: newDesc}));
    }
    function handleReorder(parentPath,fromIdx,toIdx){mutateDraft(d=>reorderSiblings(d,parentPath,fromIdx,toIdx));}
    function handleSave(){
      const nd=draft!==null?draft:data; const nds=draftDescs!==null?draftDescs:descriptions;
      setData(nd); setDescriptions(nds); setDraft(null); setDraftDescs(null);
      const updated = schemas.map((s,i)=>i===activeIdx?Object.assign({},s,{data:nd,descriptions:nds}):s);
      setSchemas(updated);
      triggerGistSave(updated);
    }
    function handleAddSchema(schema){
      const updated=schemas.concat([schema]); setSchemas(updated); setActiveIdx(updated.length-1);
      triggerGistSave(updated);
    }
    function handleDeleteSchema(idx){
      if(schemas.length<=1||!window.confirm('Delete this schema?')) return;
      const updated=schemas.filter((_,i)=>i!==idx); setSchemas(updated); setActiveIdx(Math.max(0,idx-1));
      triggerGistSave(updated);
    }
    function triggerGistSave(schemasToSave) { setPendingSaveSchemas(schemasToSave); setShowSaveModal(true); }
    function handleDiscard(){setDraft(null);setDraftDescs(null);}
    function toggleEdit(){if(editMode&&hasDraft){if(!window.confirm('Discard unsaved changes?'))return;handleDiscard();}setEditMode(e=>!e);}
    function saveMetaEdits(){
      const newData = Object.assign({}, draft!==null?draft:data, {source:meta.source,id:meta.eventId,time:meta.time,specversion:meta.specversion,type:meta.typeName});
      const newName = meta.schemaName||schemas[activeIdx].name;
      const newDescs = draftDescs!==null?draftDescs:descriptions;
      setData(newData); setDescriptions(newDescs); setDraft(null); setDraftDescs(null);
      setEditingMeta(false); setMetaDraft(null);
      const updatedSchemas = schemas.map((s,i)=>i===activeIdx?Object.assign({},s,{name:newName,data:newData,descriptions:newDescs}):s);
      setSchemas(updatedSchemas);
      triggerGistSave(updatedSchemas);
    }
    function cancelMetaEdit(){setEditingMeta(false);setMetaDraft(null);}

    const IC_DL=<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IC_SAVE=<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
    const ICEDIT=<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;

    const NAVY = 'rgb(28,45,66)';
    const IC_CHEVDN=<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="6 9 12 15 18 9"/></svg>;
    const IC_CHEVDN_W=<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" strokeWidth="2.5" strokeLinecap="round"><polyline points="6 9 12 15 18 9"/></svg>;

    function handlePayloadDividerMouseDown(e) {
      e.preventDefault();
      isDraggingPayload.current = true;
      dragStartX.current = e.clientX;
      dragStartW.current = payloadWidth;
      function onMove(ev) {
        if(!isDraggingPayload.current) return;
        var delta = dragStartX.current - ev.clientX;
        var newW = Math.min(Math.max(dragStartW.current + delta, 280), window.innerWidth * 0.85);
        setPayloadWidth(newW);
      }
      function onUp() { isDraggingPayload.current=false; document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    }

    function DropBtn({label, icon, onClick, active, white, filled}) {
      var [hov,setHov]=useState(false);
      var bg = filled?(hov?'rgb(18,36,56)':NAVY):white?(hov||active?'rgba(255,255,255,0.18)':'transparent'):(hov||active?T.blue25:'#fff');
      var fg = filled?'#fff':white?'#fff':(active?T.blue:T.textPrimary);
      var bd = filled?'transparent':white?'rgba(255,255,255,0.3)':(active?T.blue:'rgb(210,214,220)');
      return <button onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        style={{display:'flex',alignItems:'center',gap:6,padding:'5px 12px',border:'1px solid '+bd,borderRadius:5,background:bg,color:fg,fontFamily:T.font,fontSize:12,fontWeight:filled?600:500,cursor:'pointer',whiteSpace:'nowrap',transition:'all 0.12s',flexShrink:0}}>
        {icon}{label}{!filled&&IC_CHEVDN}
      </button>;
    }

    function DropMenu({items, style}) {
      return (
        <div style={Object.assign({position:'absolute',top:'calc(100% + 6px)',background:'#fff',border:'1px solid '+T.border1,borderRadius:7,boxShadow:'0 10px 32px rgba(0,0,0,0.14)',minWidth:210,zIndex:300,overflow:'hidden'},style||{})}>
          {items.map(function(item,i){
            if(item.section) return <div key={i} style={{padding:'8px 14px 4px',fontSize:10,fontWeight:700,color:T.textMuted,textTransform:'uppercase',letterSpacing:'0.08em'}}>{item.section}</div>;
            if(item.divider) return <div key={i} style={{height:1,background:T.border1,margin:'3px 0'}}/>;
            return <div key={i} onClick={item.onClick}
              style={{display:'flex',alignItems:'center',gap:8,padding:'9px 14px',cursor:item.disabled?'default':'pointer',color:item.danger?T.danger:item.disabled?T.border1:T.textPrimary,fontSize:13,fontWeight:item.bold?600:400,opacity:item.disabled?0.4:1}}
              onMouseEnter={function(e){if(!item.disabled)e.currentTarget.style.background=item.danger?T.dangerBg:T.blue25;}}
              onMouseLeave={function(e){e.currentTarget.style.background='transparent';}}>
              {item.icon&&<span style={{flexShrink:0}}>{item.icon}</span>}{item.label}
            </div>;
          })}
        </div>
      );
    }

    var schemaItems = schemas.map(function(s,i){return{label:s.name||s.id,bold:i===activeIdx,icon:i===activeIdx?<svg width="8" height="8" viewBox="0 0 24 24" fill={T.blue}><circle cx="12" cy="12" r="10"/></svg>:<span style={{width:8,display:'inline-block'}}/>,onClick:function(){setActiveIdx(i);setSchemaDropOpen(false);}};});
    var schemaMenuItems = [{section:'Eligibility'}].concat(schemaItems).concat([{divider:true},{label:'+ Add New Schema',icon:<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={T.blue} strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,onClick:function(){setSchemaDropOpen(false);setNewSchemaOpen(true);}}]);

    return (
      <div style={{display:'flex',flexDirection:'column',height:'100vh',fontFamily:T.font,color:T.textPrimary,overflow:'hidden'}}
        onClick={()=>{schemaDropOpen&&setSchemaDropOpen(false);viewAsDropOpen&&setViewAsDropOpen(false);actionDropOpen&&setActionDropOpen(false);}}>

        {/* ── TIER 1 — Navy tab bar ── */}

          {/* Wordmark */}
          <div style={{display:'flex',alignItems:'center',gap:6,marginRight:16,flexShrink:0}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="#A84309"/><rect x="13" y="3" width="8" height="8" rx="1.5" fill="#E45808"/><rect x="3" y="13" width="8" height="8" rx="1.5" fill="#CA5E20"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="#E45808"/></svg>
            <span style={{fontWeight:700,fontSize:13,color:'#fff',letterSpacing:'-0.01em',whiteSpace:'nowrap'}}><span style={{color:'#E45808'}}>API Schema</span></span>
          </div>
          

          {/* Tab: API Schema (dropdown) */}
          <div style={{position:'relative',display:'flex',alignItems:'stretch'}} onClick={function(e){e.stopPropagation();}}>
            <button onClick={()=>{setActiveTab('schema');setSchemaDropOpen(function(o){return !o;});}}
              style={{display:'flex',alignItems:'center',gap:6,padding:'0 14px',border:'none',background:'transparent',color:activeTab==='schema'?'#fff':'rgba(255,255,255,0.5)',cursor:'pointer',fontFamily:T.font,fontSize:13,fontWeight:500,borderBottom:'2px solid transparent',transition:'all 0.12s',whiteSpace:'nowrap'}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" strokeWidth="2" strokeLinecap="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
              API Schema {IC_CHEVDN_W}
            </button>
            {schemaDropOpen&&activeTab==='schema'&&<DropMenu items={schemaMenuItems} style={{left:0,minWidth:230}}/>}
          </div>

          {/* Tab: Compare */}
          <button onClick={()=>{setActiveTab('compare');setSchemaDropOpen(false);}}
            style={{display:'flex',alignItems:'center',gap:5,padding:'0 14px',border:'none',background:'transparent',color:activeTab==='compare'?'#fff':'rgba(255,255,255,0.5)',cursor:'pointer',fontFamily:T.font,fontSize:13,fontWeight:500,borderBottom:'2px solid transparent',transition:'all 0.12s',whiteSpace:'nowrap'}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="8" y2="6"/><line x1="16" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="8" y2="18"/><line x1="16" y1="18" x2="21" y2="18"/></svg>
            Compare
          </button>

          <div style={{flex:1}}/>
          {syncStatus==='syncing'&&<span style={{fontSize:11,color:'rgba(255,255,255,0.6)',flexShrink:0,alignSelf:'center'}}>Syncing…</span>}
          {syncStatus==='ok'&&<span style={{fontSize:11,color:'rgb(100,220,140)',flexShrink:0,alignSelf:'center'}}>✓ Saved</span>}
          {syncStatus==='error'&&<span style={{fontSize:11,color:'rgb(255,120,120)',flexShrink:0,alignSelf:'center'}}>⚠ Sync failed</span>}
        </div>

        {/* ── TIER 2 — White bar with shadow ── */}
        {activeTab==='schema'&&(
          <div style={{height:54,background:'#fff',borderBottom:'1px solid '+T.border1,boxShadow:'0 2px 10px rgba(0,0,0,0.08)',display:'flex',alignItems:'center',padding:'0 20px',gap:10,flexShrink:0,zIndex:20}}>
            {editingMeta?(
              <input value={meta.schemaName} onChange={function(e){setMetaDraft(function(m){return Object.assign({},m,{schemaName:e.target.value});});}}
                placeholder="Schema name" style={{fontFamily:T.mono,fontSize:15,fontWeight:700,padding:'4px 8px',border:'1px solid '+T.blue,borderRadius:4,color:T.textPrimary,outline:'none',width:220}}/>
            ):(
              <span style={{fontFamily:T.mono,fontSize:15,fontWeight:700,color:T.textPrimary,maxWidth:300,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{schemas[activeIdx]&&schemas[activeIdx].name}</span>
            )}
            <div style={{flex:1}}/>
            {editMode&&(
              <>
                {hasDraft&&<span style={{fontSize:11,color:'rgb(133,79,11)',background:'rgb(250,238,218)',padding:'2px 8px',borderRadius:10,fontWeight:500,whiteSpace:'nowrap'}}>Unsaved</span>}
                <Btn onClick={handleSave} disabled={!hasDraft}>{IC_SAVE} Save</Btn>

              </>
            )}
            {editingMeta&&!editMode&&(
              <>

              </>
            )}
            {!editMode&&(
              <>
                {/* View as dropdown */}
                <div style={{position:'relative'}} onClick={function(e){e.stopPropagation();}}>
                  <DropBtn label={'View: '+(viewMode==='tree'?'Tree':'Table')} active={viewAsDropOpen}
                    icon={viewMode==='tree'?<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 9l4-4 4 4"/><path d="M7 5v14"/><rect x="13" y="5" width="8" height="4" rx="1"/><rect x="13" y="13" width="8" height="4" rx="1"/></svg>:<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>}
                    onClick={()=>setViewAsDropOpen(function(o){return !o;})}/>
                  {viewAsDropOpen&&<DropMenu style={{right:0}} items={[
                    {label:'Tree',icon:<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 9l4-4 4 4"/><path d="M7 5v14"/><rect x="13" y="5" width="8" height="4" rx="1"/><rect x="13" y="13" width="8" height="4" rx="1"/></svg>,bold:viewMode==='tree',onClick:function(){setViewMode('tree');setViewAsDropOpen(false);}},

                </button>
                {/* Action dropdown */}
                <div style={{position:'relative'}} onClick={function(e){e.stopPropagation();}}>
                  <DropBtn label="Action" active={actionDropOpen}
                    icon={<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>}
                    onClick={()=>setActionDropOpen(function(o){return !o;})}/>
                  {actionDropOpen&&<DropMenu style={{right:0}} items={[
                    {label:'Edit Meta',icon:ICEDIT,onClick:function(){setActionDropOpen(false);setMetaDraft({source:displayData.source,eventId:displayData.id,time:displayData.time,specversion:displayData.specversion,typeName:displayData.type,schemaName:schemas[activeIdx]&&schemas[activeIdx].name||''});setEditingMeta(true);}},
                    {label:'Edit JSON',icon:<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>,onClick:function(){setActionDropOpen(false);toggleEdit();}},
                    {divider:true},
                    {label:'Download JSON',icon:IC_DL,onClick:function(){setActionDropOpen(false);downloadJSON(displayData,schemas[activeIdx]&&schemas[activeIdx].name);}},
                    {label:'Download CSV',icon:IC_DL,onClick:function(){setActionDropOpen(false);downloadCSV(displayData,displayDescs,schemas[activeIdx]&&schemas[activeIdx].name);}},
                    {divider:true},
                    {label:'Delete Schema',danger:true,disabled:schemas.length<=1,icon:<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>,onClick:function(){if(schemas.length>1){setActionDropOpen(false);setShowDeleteConfirm(true);}}},
                  ]}/>}
                </div>
              </>
            )}
          </div>
        )}

        {/* Edit meta strip */}
        {editingMeta&&activeTab==='schema'&&(
          <div style={{background:'rgb(248,250,253)',borderBottom:'1px solid '+T.border1,padding:'10px 24px',display:'flex',gap:20,alignItems:'center',flexShrink:0,flexWrap:'wrap'}}>
            {[['Event type','typeName',true],['Source','source',false],['Event ID','eventId',false],['Spec version','specversion',false]].map(function([lbl,key,wide]){return(
              <div key={key} style={{display:'flex',flexDirection:'column',gap:3}}>
                <span style={{fontSize:10,color:T.textMuted,textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:500}}>{lbl}</span>
                <input value={meta[key]||''} onChange={function(e){var v=e.target.value;setMetaDraft(function(m){var u=Object.assign({},m);u[key]=v;return u;});}}
                  style={{fontFamily:T.mono,fontSize:12,padding:'4px 8px',border:'1px solid '+T.border1,borderRadius:4,color:T.textPrimary,outline:'none',width:wide?300:160}}/>
              </div>
            );})}
          </div>
        )}

        {/* ── BODY ── */}
        {activeTab==='compare'?(
          <CompareScreen schemas={schemas}/>
        ):(
          <div style={{flex:1,display:'flex',overflow:'hidden',minHeight:0,position:'relative'}}>
            {/* Schema content */}
            <div style={{flex:1,overflowY:'auto',minWidth:0,padding:'16px 20px'}}>
              {editMode&&!hasDraft&&(
                <div style={{fontSize:11,color:T.textMuted,marginBottom:10,display:'flex',alignItems:'center',gap:5}}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                  Pencil to edit · + to add · trash to delete · drag to reorder
                </div>
              )}
              <div style={{background:T.surface,border:'1px solid '+T.border1,borderRadius:10,overflow:'hidden',boxShadow:'0 2px 8px rgba(0,0,0,0.04)'}}>
                {viewMode==='tree'?(
                  <div style={{padding:'6px 16px'}} key={treeKey}>
                    {Object.entries(displayData).map(function([k,v],i){return(
                      <TreeNode key={k} fieldKey={k} value={v} path={[k]} depth={0}
                        editMode={editMode} onDelete={handleDelete} onAdd={handleAdd} onSaveRow={handleSaveRow} onReorder={handleReorder}
                        siblingIndex={i} descriptions={displayDescs} forceOpen={forceOpen}/>
                    );})}
                  </div>
                ):(
                  <TableView data={displayData} descriptions={displayDescs} editMode={editMode} onDelete={handleDelete} onAdd={handleAdd} onSaveRow={handleSaveRow} onReorder={handleReorder}/>
                )}
              </div>
            </div>
            {/* Payload panel — absolutely positioned, overlaps table, resizable */}
            {payloadOpen&&(
              <div style={{position:'absolute',top:0,right:0,bottom:0,width:payloadWidth+'px',background:'#fff',borderLeft:'1px solid '+T.border1,boxShadow:'-6px 0 24px rgba(0,0,0,0.10)',display:'flex',flexDirection:'column',zIndex:15}}>
                {/* Drag handle */}
                <div onMouseDown={handlePayloadDividerMouseDown}
                  style={{position:'absolute',left:-4,top:0,bottom:0,width:9,cursor:'col-resize',zIndex:20,background:'transparent'}}/>
                {/* Panel header */}
                <div style={{padding:'10px 16px',borderBottom:'1px solid '+T.border1,display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                  <span style={{fontSize:13,fontWeight:600,color:T.textPrimary}}>Payload</span>
                  <div style={{flex:1}}/>
                  <button onClick={()=>setPayloadOpen(false)} style={{border:'none',background:'transparent',cursor:'pointer',color:T.textMuted,fontSize:18,lineHeight:1,padding:'2px 6px',borderRadius:3}} onMouseEnter={function(e){e.currentTarget.style.background='rgb(243,244,246)';}} onMouseLeave={function(e){e.currentTarget.style.background='transparent';}}>×</button>
                </div>
                <div style={{flex:1,overflowY:'auto',padding:16}}><PayloadPreview/></div>
              </div>
            )}
          </div>
        )}

        {/* MODALS */}
        {showSaveModal&&pendingSaveSchemas&&<SaveModal schemas={pendingSaveSchemas} dataVersion={DATA_VERSION} onClose={()=>setShowSaveModal(false)} onSaved={function(){setSyncStatus('ok');setTimeout(function(){setSyncStatus('idle');},4000);setShowSaveModal(false);}} onReload={function(){setShowSaveModal(false);window.location.reload();}}/>}
        {showDeleteConfirm&&<DeleteConfirmModal schemaName={schemas[activeIdx]&&schemas[activeIdx].name} onCancel={()=>setShowDeleteConfirm(false)} onConfirm={()=>{setShowDeleteConfirm(false);handleDeleteSchema(activeIdx);}}/>}
        {newSchemaOpen && <NewSchemaModal onClose={()=>setNewSchemaOpen(false)} onCreate={handleAddSchema} />}
      </div>
    );
  }

  window.ApiSchemaViewer = ApiSchemaViewer;
})();
</script>
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(window.ApiSchemaViewer));
</script>
</body>
</html>
