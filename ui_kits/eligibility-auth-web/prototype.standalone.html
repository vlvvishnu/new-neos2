<!-- Map string-referenced asset paths to inlined blob URLs (window.__resources) -->
<script>
(function(){
  function pathMap(){
    return {
      "assets/neos-logo.png": "neosLogo",
      "assets/wellsky-logo-white.svg": "wellskyLogo",
      "icons/at-completed.png": "atCompleted",
      "icons/at-needs-attention.png": "atNeedsAttention",
      "icons/at-in-progress.png": "atInProgress",
      "icons/automated.png": "automated",
      "icons/mdi-user.png": "mdiUser",
      "icons/member-id-card.png": "memberIdCard",
      "icons/payor-eligibility-response.png": "payorEligibilityResponse",
      "icons/search.svg": "searchIcon",
      "icons/filter.svg": "filterIcon"
    };
  }
  function resolve(src){
    if(!src || src.indexOf("blob:")===0 || src.indexOf("data:")===0) return null;
    var res = (window.__resources||{});
    var m = pathMap();
    for(var k in m){
      if(src.indexOf(k) !== -1){
        var id = m[k];
        if(res[id]) return res[id];
      }
    }
    return null;
  }
  // Intercept the img `src` setter so a known path is rewritten to its inlined
  // blob BEFORE the browser fetches it — prevents the transient 404s that would
  // otherwise be caught and shown by the bundler's error overlay.
  try {
    var proto = window.HTMLImageElement && HTMLImageElement.prototype;
    var desc = proto && Object.getOwnPropertyDescriptor(proto, "src");
    if(desc && desc.set){
      Object.defineProperty(proto, "src", {
        configurable:true, enumerable: desc.enumerable,
        get: function(){ return desc.get.call(this); },
        set: function(v){ var b = resolve(v); desc.set.call(this, b || v); }
      });
    }
    var setAttr = proto && proto.setAttribute;
    if(setAttr){
      proto.setAttribute = function(name, value){
        if(name === "src"){ var b = resolve(value); return setAttr.call(this, name, b || value); }
        return setAttr.call(this, name, value);
      };
    }
  } catch(e){}
  function patch(root){
    var imgs = (root||document).querySelectorAll ? (root||document).querySelectorAll("img") : [];
    imgs.forEach(function(img){
      var b = resolve(img.getAttribute("src"));
      if(b && img.getAttribute("src") !== b) img.src = b;
    });
  }
  window.__patchResourceImgs = patch;
  document.addEventListener("DOMContentLoaded", function(){
    patch(document);
    var mo = new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var mu = muts[i];
        if(mu.type==="attributes" && mu.target && mu.target.tagName==="IMG"){
          var b = resolve(mu.target.getAttribute("src"));
          if(b && mu.target.getAttribute("src") !== b) mu.target.src = b;
        } else if(mu.addedNodes){
          mu.addedNodes.forEach(function(n){ if(n.nodeType===1) patch(n); });
        }
      }
    });
    mo.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:["src"]});
  });
})();
</script>
